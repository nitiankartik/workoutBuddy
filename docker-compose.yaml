services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    networks:
      - mern
  backend:
    build: ./backend
    ports:
      - "4000:4000"
    networks:
      - mern
    depends_on:
      - mongodb
    environment:
      - MONGO_URI=mongodb://mongodb:27017/mydb
      - SECRET=ninjadojoshifuyoshimarioluigipeachbowser
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    networks:
      - mern
    volumes:
      - ./data:/data/db

networks:
  mern:
    driver: bridge

volumes:
  mongo-data:
    driver: local